<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Indian Kitchen Andel — Order Online</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #faf8f4; color: #1a1a1a; min-height: 100vh; }
  .page { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .brand { text-align: center; padding: 2rem 0 1.25rem; border-bottom: 1px solid #e8e2d8; margin-bottom: 1.5rem; }
  .brand-name { font-size: 24px; font-weight: 700; color: #1a1a1a; letter-spacing: 0.3px; }
  .brand-sub { font-size: 13px; color: #888; margin-top: 5px; }
  .brand-info { font-size: 12px; color: #aaa; margin-top: 8px; }
  .lang-toggle { display: flex; gap: 8px; justify-content: center; margin-bottom: 1.5rem; }
  .lang-btn { font-size: 13px; padding: 5px 16px; border-radius: 20px; border: 1px solid #d4ccbe; background: transparent; color: #888; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .lang-btn.active { background: #c8602a; color: #fff; border-color: #c8602a; font-weight: 500; }
  .section-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #c8602a; margin-bottom: 10px; margin-top: 1.75rem; }
  .category-header { font-size: 13px; font-weight: 600; color: #555; margin: 1.25rem 0 8px; padding-bottom: 6px; border-bottom: 1px solid #ede8df; }
  .menu-card { background: #fff; border: 1px solid #ede8df; border-radius: 12px; padding: 0.875rem 1rem; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px; }
  .menu-card:hover { border-color: #c8602a; }
  .dish-info { flex: 1; min-width: 0; }
  .dish-name { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .dish-badges { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 3px; font-weight: 500; }
  .badge-vegan { background: #e1f5ee; color: #085041; }
  .badge-veg { background: #eaf3de; color: #3b6d11; }
  .badge-nonveg { background: #faece7; color: #993c1d; }
  .badge-gf { background: #faeeda; color: #633806; }
  .dish-desc { font-size: 12px; color: #777; margin-top: 5px; line-height: 1.55; }
  .dish-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 90px; }
  .dish-price { font-size: 13px; font-weight: 600; color: #1a1a1a; white-space: nowrap; }
  .dish-serves { font-size: 11px; color: #aaa; white-space: nowrap; }
  .qty-control { display: flex; align-items: center; gap: 6px; }
  .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #d4ccbe; background: transparent; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #333; font-family: inherit; transition: background 0.1s; }
  .qty-btn:hover { background: #f5f0e8; }
  .qty-num { font-size: 14px; font-weight: 600; min-width: 18px; text-align: center; color: #1a1a1a; }
  .form-section { margin-top: 1.5rem; }
  .form-row { margin-bottom: 14px; }
  .form-label { font-size: 13px; color: #555; margin-bottom: 5px; display: block; font-weight: 500; }
  input[type="text"], input[type="tel"], textarea {
    width: 100%; padding: 10px 13px; border: 1px solid #ddd8ce; border-radius: 8px;
    font-size: 14px; background: #fff; color: #1a1a1a; font-family: inherit; outline: none;
  }
  input[type="text"]:focus, input[type="tel"]:focus, textarea:focus { border-color: #c8602a; }
  textarea { resize: none; height: 72px; }
  .date-chips { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .date-chip { padding: 7px 18px; border-radius: 8px; border: 1px solid #d4ccbe; font-size: 13px; cursor: pointer; background: #fff; color: #666; font-family: inherit; transition: all 0.15s; }
  .date-chip.selected { background: #c8602a; color: #fff; border-color: #c8602a; font-weight: 500; }
  .order-summary { background: #fff; border: 1px solid #ede8df; border-radius: 12px; padding: 1rem 1.25rem; margin-top: 1.5rem; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: #666; padding: 4px 0; }
  .summary-total { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; color: #1a1a1a; padding-top: 10px; margin-top: 8px; border-top: 1px solid #ede8df; }
  .wa-btn { width: 100%; margin-top: 1.25rem; padding: 14px; border-radius: 12px; border: none; background: #25D366; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; transition: opacity 0.15s; }
  .wa-btn:hover { opacity: 0.92; }
  .wa-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .wa-icon { width: 20px; height: 20px; fill: #fff; }
  .empty-note { font-size: 13px; color: #bbb; text-align: center; padding: 0.75rem 0; }
  @media (max-width: 480px) { .page { padding: 1rem 0.75rem 3rem; } }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="brand-name">🌿 The Indian Kitchen Andel</div>
    <div class="brand-sub" id="brand-sub">Homemade authentic Indian food · Andel, Netherlands</div>

  <div class="section-label" id="lbl-menu">This weekend's menu</div>
  <div id="menu-list"></div>

  <div class="form-section">
    <div class="section-label" id="lbl-details">Your details</div>
    <div class="form-row">
      <label class="form-label" id="lbl-name">Your name</label>
      <input type="text" id="inp-name" placeholder="e.g. Sophie de Vries">
    </div>
    <div class="form-row">
      <label class="form-label" id="lbl-phone">WhatsApp number</label>

    <div class="form-row">
      <label class="form-label" id="lbl-date">Delivery date</label>

        <button class="date-chip" id="chip-sun" onclick="selectDate('sun')">Sunday</button>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" id="lbl-notes">Notes or special requests?</label>
      <textarea id="inp-notes" placeholder="Spice level, allergies, etc."></textarea>
    </div>
  </div>

  <div class="order-summary" id="summary-box" style="display:none">
    <div class="section-label" id="lbl-summary">Order summary</div>
    <div id="summary-items"></div>
    <div class="summary-total">

  <button class="wa-btn" id="wa-btn" onclick="sendToWhatsApp()" disabled>

    <span id="lbl-wa-btn">Send order via WhatsApp</span>
  </button>
  <p class="empty-note" id="lbl-wa-hint">Select dishes and fill in your details to place your order.</p>
</div>

  {id:20,cat:'breads',en:'Buckwheat Roti',nl:'Boekweit Roti',desc_en:'Soft, gluten-free flatbread made from pure buckwheat flour, cooked on a hot griddle.',desc_nl:'Zacht, glutenvrij platbrood van pure boekweitmeel, gebakken op een hete plaat.',price:1.99,unit_en:'per piece',unit_nl:'per stuk',serves:'',tags:['vegan','gf']},
  {id:21,cat:'breads',en:'Tikona Paratha',nl:'Tikona Paratha',desc_en:'Whole-wheat layered flatbread, hand-rolled into a triangle. Soft and flaky.',desc_nl:'Volkoren gelaagd platbrood, met de hand tot driehoek uitgerold. Zacht en bladerig.',price:1.99,unit_en:'per piece',unit_nl:'per stuk',serves:'',tags:['vegan']},
  {id:22,cat:'rice',en:'Jeera Rice',nl:'Jeera Rijst',desc_en:'Fragrant basmati tempered with toasted cumin seeds and gentle spices. Light and aromatic.',desc_nl:'Geurige basmati met geroosterde komijnzaden en zachte specerijen. Licht en aromatisch.',price:2.99,unit_en:'',unit_nl:'',serves:'serves 1',tags:['vegan']},
];
const cats=[{id:'starters',en:'Starters',nl:'Voorgerechten'},{id:'mains',en:'Main course',nl:'Hoofdgerechten'},{id:'breads',en:'Breads',nl:'Broden'},{id:'rice',en:'Rice',nl:'Rijst'}];
let lang='en',qty={},selectedDate=null;
menu.forEach(d=>qty[d.id]=0);
const t={en:{brand_sub:'Homemade authentic Indian food · Andel, Netherlands',brand_info:'Orders placed one day in advance · Sat & Sun from 17:00',lbl_menu:"This weekend's menu",lbl_details:'Your details',lbl_name:'Your name',lbl_phone:'WhatsApp number',lbl_date:'Delivery date',lbl_notes:'Notes or special requests?',lbl_summary:'Order summary',lbl_total:'Total',lbl_wa_btn:'Send order via WhatsApp',lbl_wa_hint:'Select dishes and fill in your details to place your order.',chip_sat:'Saturday',chip_sun:'Sunday',ph_name:'e.g. Sophie de Vries',ph_phone:'+31 6 xxxxxxxx',ph_notes:'Spice level, allergies, etc.'},nl:{brand_sub:'Zelfgemaakt authentiek Indiaas eten · Andel, Nederland',brand_info:'Bestellingen één dag van tevoren · Za & Zo vanaf 17:00',lbl_menu:'Menu dit weekend',lbl_details:'Jouw gegevens',lbl_name:'Jouw naam',lbl_phone:'WhatsApp-nummer',lbl_date:'Bezorgdatum',lbl_notes:'Opmerkingen of speciale wensen?',lbl_summary:'Besteloverzicht',lbl_total:'Totaal',lbl_wa_btn:'Bestelling via WhatsApp sturen',lbl_wa_hint:'Selecteer gerechten en vul je gegevens in om te bestellen.',chip_sat:'Zaterdag',chip_sun:'Zondag',ph_name:'bijv. Sophie de Vries',ph_phone:'+31 6 xxxxxxxx',ph_notes:'Kruidigheid, allergieën, etc.'}};
function tagBadges(tags){return tags.map(t=>{if(t==='vegan')return'<span class="badge badge-vegan">vegan</span>';if(t==='veg')return'<span class="badge badge-veg">veg</span>';if(t==='nonveg')return'<span class="badge badge-nonveg">non-veg</span>';if(t==='gf')return'<span class="badge badge-gf">gluten free</span>';return'';}).join(' ');}
function renderMenu(){const c=document.getElementById('menu-list');let h='';cats.forEach(cat=>{const items=menu.filter(d=>d.cat===cat.id);h+=`<div class="category-header">${lang==='nl'?cat.nl:cat.en}</div>`;items.forEach(d=>{const name=lang==='nl'?d.nl:d.en,desc=lang==='nl'?d.desc_nl:d.desc_en,unit=lang==='nl'?d.unit_nl:d.unit_en,priceStr=`€${d.price.toFixed(2)}${unit?' / '+unit:''}`,serves=d.serves?`· ${d.serves}`:'';h+=`<div class="menu-card"><div class="dish-info"><div class="dish-name">${name}</div><div class="dish-badges">${tagBadges(d.tags)}</div><div class="dish-desc">${desc}</div></div><div class="dish-right"><div><div class="dish-price">${priceStr}</div>${serves?`<div class="dish-serves">${serves}</div>`:''}</div><div class="qty-control"><button class="qty-btn" onclick="changeQty(${d.id},-1)">−</button><span class="qty-num" id="qty-${d.id}">${qty[d.id]}</span><button class="qty-btn" onclick="changeQty(${d.id},1)">+</button></div></div></div>`;});});c.innerHTML=h;}
function setLang(l){lang=l;document.querySelectorAll('.lang-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&l==='en')||(i===1&&l==='nl')));applyLang();renderMenu();renderSummary();}
function applyLang(){const s=t[lang];['brand-sub','brand-info','lbl-menu','lbl-details','lbl-name','lbl-phone','lbl-date','lbl-notes','lbl-summary','lbl-total','lbl-wa-btn','lbl-wa-hint'].forEach(id=>{const k=id.replace(/-([a-z])/g,(_,c)=>c.toUpperCase()).replace('lbl','lbl');const map={'brand-sub':'brand_sub','brand-info':'brand_info','lbl-menu':'lbl_menu','lbl-details':'lbl_details','lbl-name':'lbl_name','lbl-phone':'lbl_phone','lbl-date':'lbl_date','lbl-notes':'lbl_notes','lbl-summary':'lbl_summary','lbl-total':'lbl_total','lbl-wa-btn':'lbl_wa_btn','lbl-wa-hint':'lbl_wa_hint'};document.getElementById(id).textContent=s[map[id]];});document.getElementById('chip-sat').textContent=s.chip_sat;document.getElementById('chip-sun').textContent=s.chip_sun;document.getElementById('inp-name').placeholder=s.ph_name;document.getElementById('inp-phone').placeholder=s.ph_phone;document.getElementById('inp-notes').placeholder=s.ph_notes;}
function changeQty(id,delta){qty[id]=Math.max(0,qty[id]+delta);const el=document.getElementById('qty-'+id);if(el)el.textContent=qty[id];renderSummary();updateBtn();}
function selectDate(d){selectedDate=d;document.getElementById('chip-sat').classList.toggle('selected',d==='sat');document.getElementById('chip-sun').classList.toggle('selected',d==='sun');updateBtn();}
function renderSummary(){const items=menu.filter(d=>qty[d.id]>0);const box=document.getElementById('summary-box');if(!items.length){box.style.display='none';return;}box.style.display='block';let total=0;document.getElementById('summary-items').innerHTML=items.map(d=>{const sub=d.price*qty[d.id];total+=sub;const name=lang==='nl'?d.nl:d.en;return`<div class="summary-row"><span>${qty[d.id]}× ${name}</span><span>€${sub.toFixed(2)}</span></div>`;}).join('');document.getElementById('total-amt').textContent='€'+total.toFixed(2);}
function updateBtn(){document.getElementById('wa-btn').disabled=!(menu.some(d=>qty[d.id]>0)&&selectedDate);}
function sendToWhatsApp(){const name=document.getElementById('inp-name').value.trim(),phone=document.getElementById('inp-phone').value.trim(),notes=document.getElementById('inp-notes').value.trim(),s=t[lang],dateLabel=selectedDate==='sat'?s.chip_sat:s.chip_sun,items=menu.filter(d=>qty[d.id]>0),total=items.reduce((sum,d)=>sum+d.price*qty[d.id],0);let msg=`🌿 *The Indian Kitchen Andel*\n📋 *${lang==='nl'?'Nieuwe bestelling':'New Order'}*\n\n`;if(name)msg+=`👤 ${name}\n`;if(phone)msg+=`📱 ${phone}\n`;msg+=`📅 ${dateLabel}\n\n*${lang==='nl'?'Bestelling':'Order'}:*\n`;items.forEach(d=>{const n=lang==='nl'?d.nl:d.en,unit=lang==='nl'?d.unit_nl:d.unit_en;msg+=`• ${qty[d.id]}× ${n}${unit?' ('+unit+')':''} — €${(d.price*qty[d.id]).toFixed(2)}\n`;});msg+=`\n💰 *${s.lbl_total}: €${total.toFixed(2)}*`;if(notes)msg+=`\n\n📝 ${notes}`;window.open(`https://wa.me/31630853217?text=${encodeURIComponent(msg)}`,'_blank');}
renderMenu();applyLang();
</script>
